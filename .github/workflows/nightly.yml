name: Nightly verification and tag

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lean build artifacts
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - name: Build
        run: ./build.sh 2>&1 | tee build.log

      - name: Audit convergence results and budgets
        run: python3 -u run_comparator.py -j 2 2>&1 | tee comparator.log

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs
          path: |
            build.log
            comparator.log
          retention-days: 14

  tag:
    needs: verify
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag verified commit
        shell: bash
        run: |
          tag="nightly-$(date -u +%Y-%m-%d)"
          existing=$(git tag --points-at "$GITHUB_SHA" --list 'nightly-*')
          if [[ -n "$existing" ]] || git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "A nightly tag already exists for this commit or UTC date; skipping."
            exit 0
          fi
          cat > "$RUNNER_TEMP/nightly-tag.txt" <<EOF
          Verified LongTails snapshot

          Commit: $GITHUB_SHA
          Verified at (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Lean toolchain: $(cat lean-toolchain)
          Dependencies: lake-manifest.json at the verified commit
          Build: ./build.sh passed
          Audit: python3 -u run_comparator.py -j 2 passed
          Permitted axioms: propext, Classical.choice, Quot.sound
          Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" "$GITHUB_SHA" -F "$RUNNER_TEMP/nightly-tag.txt"
          git push origin "refs/tags/$tag"
